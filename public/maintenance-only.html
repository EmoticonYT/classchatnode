<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance — ClassChat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f12;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .maintenance-card {
      max-width: 400px;
    }
    .maintenance-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: #8a8a9a;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="maintenance-card">
    <div class="maintenance-icon">🔧</div>
    <h1>Under maintenance</h1>
    <p>ClassChat is temporarily unavailable. Please try again later.</p>
  </div>
</body>
</html>
